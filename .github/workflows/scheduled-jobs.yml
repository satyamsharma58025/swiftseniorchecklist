name: scheduled-jobs
on:
  schedule:
    - cron: "30 23 * * *"   # 05:00 IST
    - cron: "0 2 * * *"     # 07:30 IST backup
    - cron: "*/15 3-6 * * *" # Dispatch ticks, 08:30-12:15 IST
    - cron: "*/15 12-14 * * *" # Dispatch ticks, 17:30-20:15 IST
    - cron: "*/15 7-11 * * *" # Reminder retries, 12:30-16:45 IST
    - cron: "30 14 * * *"   # 20:00 IST EOD cutoff
    - cron: "10 4 * * *"    # 09:40 IST watchdog
    - cron: "10 5 * * *"    # 10:40 IST watchdog
    - cron: "20 13 * * *"   # 18:50 IST watchdog
    - cron: "10 14 * * *"   # 19:40 IST watchdog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  daily-sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 23 * * *' ||
      github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/daily-sync" 2>&1)
          CURL_STATUS=$?
          set -e
          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          printf 'HTTP status: %s (curl exit: %s)\n%s\n' "$HTTP_CODE" "$CURL_STATUS" "$BODY"
          if [ "$CURL_STATUS" -ne 0 ] || [ "${HTTP_CODE#2}" = "$HTTP_CODE" ]; then
            exit 1
          fi

  dispatch:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '*/15 3-6 * * *' ||
       github.event.schedule == '*/15 12-14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/dispatch?slot=auto" 2>&1)
          CURL_STATUS=$?
          set -e
          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          printf 'HTTP status: %s (curl exit: %s)\n%s\n' "$HTTP_CODE" "$CURL_STATUS" "$BODY"
          if [ "$CURL_STATUS" -ne 0 ] || [ "${HTTP_CODE#2}" = "$HTTP_CODE" ]; then
            exit 1
          fi

  reminders:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '*/15 3-6 * * *' ||
       github.event.schedule == '*/15 7-11 * * *' ||
       github.event.schedule == '*/15 12-14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/reminder-sweep" 2>&1)
          CURL_STATUS=$?
          set -e
          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          printf 'HTTP status: %s (curl exit: %s)\n%s\n' "$HTTP_CODE" "$CURL_STATUS" "$BODY"
          if [ "$CURL_STATUS" -ne 0 ] || [ "${HTTP_CODE#2}" = "$HTTP_CODE" ]; then
            exit 1
          fi

  eod-cutoff:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/eod-cutoff" 2>&1)
          CURL_STATUS=$?
          set -e
          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          printf 'HTTP status: %s (curl exit: %s)\n%s\n' "$HTTP_CODE" "$CURL_STATUS" "$BODY"
          if [ "$CURL_STATUS" -ne 0 ] || [ "${HTTP_CODE#2}" = "$HTTP_CODE" ]; then
            exit 1
          fi

  watchdog:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '10 4 * * *' ||
       github.event.schedule == '10 5 * * *' ||
       github.event.schedule == '20 13 * * *' ||
       github.event.schedule == '10 14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check health endpoint
        run: |
          # Health must stay green; if the app is inactive for >60 days, the
          # health summary should also fail the job before we keep shipping.
          set +e
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\n%{http_code}" \
            "${{ secrets.APP_BASE_URL }}/api/health/daily?format=text" 2>&1)
          CURL_STATUS=$?
          set -e
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          TEXT=$(echo "$RESPONSE" | head -n -1)
          
          echo "=== Health Status ===" 
          echo "$TEXT"
          echo "=== HTTP Status: $HTTP_CODE ==="
          
          if [ "$CURL_STATUS" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Health endpoint returned DOWN status"
            exit 1
          fi
