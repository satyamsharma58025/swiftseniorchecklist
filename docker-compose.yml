services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swift_senior_checklist_test
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swift_senior_checklist_test"]
      interval: 5s
      timeout: 5s
      retries: 10
