services:
  - type: web
    name: swift-senior-checklist
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: CRON_SECRET_PREVIOUS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_INTEGRATION_MODE
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_FORM_URL
        sync: false
      - key: SENIOR_AUTHORITY_PHONE
        sync: false
      - key: SENIOR_AUTHORITY_NAME
        sync: false
